name: Build EGaosuTidy dylib

on:
  # 任何分支的 push 都触发。原来是 branches: [main, master]，
  # 去掉分支过滤是为了排除"推到了别的分支名所以不触发"这一类原因。
  push:
  # 也可以在网页手动触发：Actions → 左侧选 Build EGaosuTidy dylib → Run workflow
  workflow_dispatch:
    inputs:
      variants:
        description: '要构建的变体（空格分隔）。正常跑留空 = 只出 normal'
        required: false
        default: 'normal'

jobs:
  build:
    runs-on: macos-latest   # Xcode 自带 clang，原生支持 arm64-apple-darwin 目标，比 ubuntu 稳得多
    env:
      THEOS: ${{ github.workspace }}/theos
      # ★ 默认只出 normal。
      #   理由（Shawn 2026-10-01 明确要求）：验证哪个就编哪个，不要每次都扔 4 个包上去 ——
      #   多出来的 3 个变体是为了定位"是不是我们的代码引起的"才存在的诊断台阶，
      #   功能验证阶段它们只是噪音，还拖慢 CI、让产物包变大。
      #   需要台阶时：Actions → Run workflow → variants 填 "normal nofloat dispatchonly minimal"。
      VARIANTS: ${{ github.event.inputs.variants || 'normal' }}
      THEOS_NO_AUTO_SIGN: 1   # 尽量跳过自签；但实测该 Theos 版本仍会调 ldid，故下面显式装 ldid

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos + iOS SDK + ldid
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          curl -fsSL https://github.com/theos/sdks/archive/master.zip -o /tmp/sdk.zip
          unzip -q /tmp/sdk.zip -d /tmp/sdkextract
          # theos/sdks 的 zip 解压出 sdks-master/ 嵌套目录；Theos 要的是 $THEOS/sdks/iPhoneOS.sdk 直接挂在下面
          mkdir -p "$THEOS/sdks"
          mv /tmp/sdkextract/sdks-master/* "$THEOS/sdks/"
          # macOS runner 无自带 ldid；Theos 签名步骤需要它（否则编好的 dylib 在签名步被删，构建报 Error 127）
          brew install ldid
          echo "---- SDK 目录 ----"; ls "$THEOS/sdks"
          echo "---- ldid ----"; which ldid

      - name: Static preflight audit
        continue-on-error: true
        run: |
          python3 tools/preflight.py Tweak.xm || true

      # ---------------------------------------------------------------------
      # ★ 一轮出 N 个变体（默认 N=1，只出 normal；列表由 env.VARIANTS 控制）
      #   为什么还能出多个：每一版 = 一轮 CI + 一次真机注入，代价大；
      #   而"是不是我们的代码引起的"可以拆成**互不重叠的台阶**，一次全出更省时间。
      #   normal / nofloat / dispatchonly / minimal —— 判读规则见 Tweak.xm 配置区。
      #   只在**排查崩溃**时才手动跑全部；日常功能验证只跑 normal。
      #
      # ★★ 产物路径必须**写死**，绝对不能用 `find .theos -name 'EGaosuTidy.dylib' | head -1`：
      #   Theos 会跑 `dsymutil <dylib>`（不带 -o），生成
      #     .theos/obj/debug/arm64/EGaosuTidy.dylib.dSYM/Contents/Resources/DWARF/EGaosuTidy.dylib
      #   —— 这个 **dSYM 里的文件同名也叫 EGaosuTidy.dylib**（filetype=10 MH_DSYM，只有 __DWARF 段）。
      #   find 先钻进那个目录，head -1 就把它抓出来了：产物看着"成功"，其实是调试符号，
      #   注入到真机上什么都不会发生。实测踩过（2026-09-30）。
      # ---------------------------------------------------------------------
      - name: Build all 4 variants
        continue-on-error: true
        run: |
          set +e
          mkdir -p dist
          for V in $VARIANTS; do
            make clean >/dev/null 2>&1
            rm -rf .theos
            make EG_VARIANT="$V" messages=yes > "build-$V.log" 2>&1
            RC=$?
            OUT=".theos/obj/debug/EGaosuTidy.dylib"
            [ -f "$OUT" ] || OUT=".theos/obj/EGaosuTidy.dylib"
            {
              echo ""
              echo "=================== variant = $V ==================="
              echo "[variant $V] make 退出码 = $RC"
              if [ -f "$OUT" ]; then
                cp "$OUT" "dist/EGaosuTidy-$V.dylib"
                echo "[variant $V] 产物 = $OUT  ($(stat -f%z "$OUT") bytes)"
              else
                echo "[variant $V] !! 预期路径不存在，列出 .theos 下所有匹配："
                find .theos -name 'EGaosuTidy*' 2>/dev/null
              fi
            } | tee -a "build-$V.log"
          done
          echo ""
          echo "---- dist ----"
          ls -la dist

      - name: Show hard errors (all variants)
        if: always()
        run: |
          for V in $VARIANTS; do
            echo "---- $V ----"
            if [ -f "build-$V.log" ]; then
              grep -n "error:" "build-$V.log" || echo "(no hard error)"
            else
              echo "(no log)"
            fi
          done

      # 自证：产物必须是**真的 dylib**（filetype=6 MH_DYLIB），且嵌着本变体的标记字符串。
      # 两道检查各防一类静默错误：
      #   filetype 防"抓到 dSYM 调试符号文件"（见上面那段说明）
      #   标记字符串防"产物是上一个变体的残留"
      # 校验失败**要让 job 变红** —— 一个"绿着但产物是坏的"构建比红色构建危险得多。
      - name: Verify artifacts are real dylibs and carry the right variant tag
        if: always()
        run: |
          mkdir -p dist
          : > dist/verify.txt
          for V in $VARIANTS; do
            F="dist/EGaosuTidy-$V.dylib"
            if [ ! -f "$F" ]; then
              echo "[$V] FAILED 缺产物" >> dist/verify.txt
              continue
            fi
            SZ=$(stat -f%z "$F")
            FT=$(od -An -tu4 -j12 -N4 "$F" | tr -d ' \n')
            if [ "$FT" = "6" ]; then
              echo "[$V] OK   filetype=6 MH_DYLIB   ${SZ} bytes" >> dist/verify.txt
            elif [ "$FT" = "10" ]; then
              echo "[$V] FAILED filetype=10 MH_DSYM —— 抓到的是调试符号文件，不是 dylib！" >> dist/verify.txt
            else
              echo "[$V] FAILED filetype=$FT 意外（6=MH_DYLIB, 10=MH_DSYM）" >> dist/verify.txt
            fi
            file "$F" >> dist/verify.txt 2>&1
            if strings "$F" | grep -qx "$V"; then
              echo "[$V] OK   变体标记 \"$V\" 已嵌入" >> dist/verify.txt
            else
              echo "[$V] FAILED 找不到变体标记 \"$V\" —— 产物可能串档" >> dist/verify.txt
            fi
          done
          cat dist/verify.txt
          if grep -q "FAILED" dist/verify.txt; then
            echo ">>> 产物校验未通过"
            exit 1
          fi
          echo ">>> 产物校验通过"

      - name: Upload build logs
        if: always()   # 不论成败都上传日志
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build-*.log
            dist/verify.txt

      - name: Upload dylibs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EGaosuTidy-dylibs
          path: dist/*.dylib
